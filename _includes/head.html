<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.className = 'js';</script>
  {% seo %}
  <meta name="theme-color" content="#0B1620">
  <link rel="preload" href="{{ '/assets/fonts/archivo-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/hanken-grotesk-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {% if page.hero %}
  <link rel="preload" as="image" fetchpriority="high" type="image/avif"
    imagesrcset="{{ '/assets/img/hero-800.avif' | relative_url }} 800w, {{ '/assets/img/hero-1280.avif' | relative_url }} 1280w, {{ '/assets/img/hero-1920.avif' | relative_url }} 1920w"
    imagesizes="100vw">
  {% endif %}
  <style>{% include main.css %}</style>
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {% if page.hero %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "{{ site.title }} – {{ site.tagline }}",
    "description": {{ site.description | jsonify }},
    "url": "{{ site.url }}/",
    "image": "{{ page.image | absolute_url }}",
    "telephone": "{{ site.contact.phone_link }}",
    "email": "{{ site.contact.email }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site.contact.street }}",
      "postalCode": "{{ site.contact.postal_code }}",
      "addressLocality": "{{ site.contact.city }}",
      "addressRegion": "{{ site.contact.region }}",
      "addressCountry": "DE"
    },
    "sameAs": ["{{ site.contact.facebook }}"]
  }
  </script>
  {% endif %}
</head>
